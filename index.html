<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata Catalogo</title>

  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Interfaccia Overlay */
    #scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Mirino a 4 angoli bianchi */
    .scan-frame {
      width: 75vw;
      height: 50vw;
      max-width: 340px;
      max-height: 230px;
      position: relative;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #ffffff;
      border-style: solid;
    }
    .top-left { top: 0; left: 0; border-width: 5px 0 0 5px; }
    .top-right { top: 0; right: 0; border-width: 5px 5px 0 0; }
    .bottom-left { bottom: 0; left: 0; border-width: 0 0 5px 5px; }
    .bottom-right { bottom: 0; right: 0; border-width: 0 5px 5px 0; }

    /* Linea Laser di Scansione */
    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      animation: scanAnim 2s ease-in-out infinite alternate;
    }

    @keyframes scanAnim {
      0% { top: 5%; }
      100% { top: 95%; }
    }

    .instruction-text {
      color: #ffffff;
      margin-top: 35px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 20px;
    }

    .scanning-hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Overlay UI Mirino -->
  <div id="scanner-overlay">
    <div class="scan-frame" id="scan-frame">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
      <div class="scan-line" id="scan-line"></div>
    </div>
    <div class="instruction-text" id="instruction-text">Inquadra i loghi sul catalogo</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- Precaricamento Immagini Loghi -->
    <a-assets timeout="10000">
      <img id="logo-forpin" src="./forpin.png" crossorigin="anonymous">
      <img id="logo-confindustria" src="./confindustria.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

    <!-- TARGET UNICO (Inquadratura del catalogo) -->
    <a-entity id="target-catalogo" mindar-image-target="targetIndex: 0">
      
      <!-- LOGO 1: FORPIN (Sopra il logo Forpin cartaceo) -->
      <a-plane 
        class="clickable" 
        position="-0.05 0.15 0.05" 
        width="0.75" 
        height="0.25" 
        material="src: #logo-forpin; transparent: true; alphaTest: 0.1; shader: flat;" 
        animation="property: position; to: -0.05 0.15 0.12; dir: alternate; dur: 1500; loop: true;"
        redirect-on-click="url: https://www.forpin.it/">
      </a-plane>

      <!-- LOGO 2: CONFINDUSTRIA PIACENZA (Sopra il logo Confindustria cartaceo) -->
      <a-plane 
        class="clickable" 
        position="-0.05 -0.15 0.05" 
        width="0.75" 
        height="0.25" 
        material="src: #logo-confindustria; transparent: true; alphaTest: 0.1; shader: flat;" 
        animation="property: position; to: -0.05 -0.15 0.12; dir: alternate; dur: 1500; loop: true;"
        redirect-on-click="url: https://www.confindustria.pc.it/">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    // Gestore del click con reindirizzamento ai singoli link dedicati
    AFRAME.registerComponent('redirect-on-click', {
      schema: {
        url: { type: 'string', default: '' }
      },
      init: function () {
        const data = this.data;
        this.el.addEventListener('click', function (evt) {
          evt.stopPropagation();
          if (data.url) {
            window.location.href = data.url;
          }
        });
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const scanLine = document.getElementById('scan-line');
      const instructionText = document.getElementById('instruction-text');
      const targetCatalogo = document.getElementById('target-catalogo');

      targetCatalogo.addEventListener("targetFound", () => {
        scanLine.classList.add('scanning-hidden');
        instructionText.innerText = "Tocca un logo per aprire la pagina!";
      });

      targetCatalogo.addEventListener("targetLost", () => {
        scanLine.classList.remove('scanning-hidden');
        instructionText.innerText = "Inquadra i loghi sul catalogo";
      });
    });
  </script>
</body>
</html>
